services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portfolio-site
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      NODE_ENV: development
    stdin_open: true
    tty: true
